<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22.7 59.8" role="img" aria-label="Марка Fixli">
  <title>Марка Fixli</title>
  <!--
    Марка-фигура: увеличенная буква `i` из знака. Точка это голова, палочка
    тело, вынос сбоку рука.

    ВНИМАНИЕ: на фургоне стоит НЕ эта фигура. Раньше здесь было написано «то же
    самое стоит на бортах и корме», и замер 2026-08-17 это опроверг: фигура на
    бортах и корме слитная, зазора голова↔тело у неё нет, пропорция 0,50 против
    0,35 у буквы из знака. Файла с той редакцией у проекта нет.

    Одноцветная версия — для печати в одну краску, вышивки, гравировки и
    тиснения. Взят синий: он даёт 9,44 к белому, а фирменный оранжевый — 2,65
    и порога 3,0 для крупной графики не берёт, то есть одной краской
    оранжевую марку на белом ставить нельзя. Двухцветная лежит рядом
    (`fixli-марка.svg`) — так она стоит в фавиконе.

    Ставится вместо словесного знака во всём, что мельче 40 px по высоте:
    фавикон, аватар, иконка приложения, кнопка, мессенджер. Причина числом:
    зазор голова↔тело у марки 9,7 % высоты против 2,86 % у знака, поэтому при
    иконке 16 px он ещё равен 1,45 px, а у словесного знака исчезает вовсе.

    Цвета литералами — осознанное исключение из правила «значение живёт один
    раз в brand/tokens.css»: отдельный файл уезжает в типографию и в рекламный
    кабинет, где никакого CSS нет. Значения равны токенам fx-orange и
    fx-navy, проверяются пипеткой по ним.
    ВНИМАНИЕ, ГРАБЛЯ: в комментарии SVG нельзя писать двойной дефис — это
    невалидный XML, и браузер не рисует файл ВОВСЕ, показывая alt вместо знака.
    Поэтому имена токенов здесь пишутся без ведущих дефисов: fx-orange, а не
    полное имя переменной. Так уже ломалось: четыре файла знака разом отдавали
    битую картинку, и нашли это глаза на кадре, а не проверка.
  -->
  <circle cx="8.9" cy="8.2" r="8.2" fill="#12438f" />
  <path
    fill="#12438f"
    d="M0 59.8 L0 28.5 C0.2 24.5 4 22.2 8.5 22.2 C10.5 22.4 16 25.5 22.7 35 C23.5 36.8 22.9 38.2 20.5 38.6 L15 39 L15 59.8 Z"
  />
</svg>
