<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 436 198" role="img" aria-label="fixli">
  <title>fixli</title>
  <!--
    Знак на тёмном фоне — ВЫВОРОТКА, а не инверсия.

    На носителях заказчика (футболки и кепка в макетах найма) выворотка
    двухцветная: `fix` остаётся фирменным оранжевым, белым становится только
    `li`. Это факт с носителя, а не наше решение. Знак целиком в белый не
    выворачивают — так делает пока только `Logo.astro` в варианте `onDark`
    (через `brightness-0 invert` растра), и это расхождение с носителями,
    а не образец для повторения.

    Фон под этой вывороткой обязан быть тёмным: оранжевый по белому даёт 2,65
    и не читается. Проверенные подложки — `fx-navy-deep` и `fx-navy-darkest`.

    Происхождение: наша перетрассировка растра 436 × 198 из материалов
    заказчика (силуэт по альфа-каналу, marching squares с субпиксельной
    интерполяцией, распознавание прямых и дуг). Расхождение с исходным PNG
    1,05 % при 1×, 2,29 % при 4× — мерит `.business/assets/сверка-обводки.mjs`.
    Файла от дизайнера заказчика у проекта нет; крупнее источника в его
    материалах не существует, поэтому это потолок, а не выбор.

    Границы применения: экран, печать визитки и бланка, вышивка и шелкография —
    да. Оклейка фургона метровыми буквами — нет: 1 px исходника на двухметровом
    борту ≈ 4,6 мм, и волна на дуге станет видна вблизи. Для оклейки берётся
    исходник дизайнера по ТЗ `.business/assets/тз-логотип-для-анимации.md`.

    Про цвета: здесь они литералами, и это осознанное исключение из правила
    «значение существует один раз, в brand/tokens.css». Отдельный SVG-файл
    уезжает в типографию и в рекламный кабинет, где никакого CSS нет. Значения
    равны токенам fx-orange и fx-navy и проверяются пипеткой по ним:
    трассированный вектор однажды уже принёс цвета замера (#F28123 / #12448D)
    вместо цветов бренда, и первый экран сайта полдня показывал знак не в
    фирменном оранжевом.

    Фигура человека в знаке — это буква `i` целиком: точка это голова, палочка
    тело, вынос сбоку рука. Таких букв две, зеркальных: оранжевая в `fix` тянет
    руку вправо, синяя в `li` влево, и они идут навстречу друг другу через `x`
    и `l`. Буква `l` — простой брусок, фигуры в нём нет.
    ВНИМАНИЕ, ГРАБЛЯ: в комментарии SVG нельзя писать двойной дефис — это
    невалидный XML, и браузер не рисует файл ВОВСЕ, показывая alt вместо знака.
    Поэтому имена токенов здесь пишутся без ведущих дефисов: fx-orange, а не
    полное имя переменной. Так уже ломалось: четыре файла знака разом отдавали
    битую картинку, и нашли это глаза на кадре, а не проверка.
  -->
  <path
    id="f"
    fill="#f38025"
    d="M 68.68 10.5 L 102.5 10.08 A 4.26 4.26 0 0 1 105.3 15.5 L 105.17 37.5 A 6.91 6.91 0 0 1 98.5 39.53 L 73.5 40.22 A 15.26 15.26 0 0 0 63.89 47.5 A 33.39 33.39 0 0 0 61.19 64.5 L 61.5 70.82 L 64.5 71.69 L 100.5 71.73 L 101.58 73.5 L 93.5 100.53 L 88.5 101.31 L 62.48 101.5 L 61.4 103.5 L 61.08 188.5 L 59.5 189.63 L 29.96 189.5 L 28.87 185.5 L 28.5 102.22 L 22.5 101.26 L 12.5 100.81 L 11.13 99.5 L 11.5 72.26 L 27.56 71.5 L 28.81 68.5 L 29.87 47.5 L 33.71 35.5 L 40.14 25.5 L 49.69 17.5 L 56.5 13.89 L 70.5 10.12 Z"
